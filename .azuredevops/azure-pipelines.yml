# A runtime parameter rather than a variable, because a variable declared in YAML cannot be set
# when a run is queued and the whole point of this one is to be set by hand, once, to watch the
# rollback work. It exists because a genuinely broken commit cannot be used for that: dev deploys
# first and its smoke test fails, so prod never runs and the rollback never fires. The same wall
# phase 4 met when it needed to prove the Key Vault assertion.
#
# What makes a knob like this acceptable, where the skip variable considered for the Snyk gate was
# not, is that it can only ever make the pipeline stricter. Setting it causes a failure; it cannot
# suppress one, and there is no value that turns a check off. The enumerated values are the only
# ones accepted, so it cannot be set to anything else by accident either.
#
# "0" fails the verification before any traffic has moved, which proves the other half of the
# claim: a revision that fails there never reaches production at all. The rollback still runs and
# plans nothing, which is worth knowing rather than surprising - it is idempotent, and safe to run
# after any failure.
parameters:
  - name: failCanaryAt
    displayName: "Deliberately fail prod's verification at this weight (to exercise the rollback)"
    type: string
    default: "none"
    values: ["none", "0", "10", "50", "100"]

variables:
  REGISTRY_NAME: "crparcelquoteuks01"
  LOGIN_SERVER: "crparcelquoteuks01.azurecr.io"

trigger:
  branches:
    include: [main]
  paths:
    include: [app, infra, .azuredevops]
    exclude: [infra/bootstrap]

pr:
  branches:
    include: [main]
  paths:
    include: [app, infra, .azuredevops]

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: LintTestBuild
        displayName: "Lint, test and build"
        steps:
          - checkout: self
            fetchDepth: 0
          - task: SonarCloudPrepare@4
            displayName: "Prepare Sonar analysis"
            inputs:
              SonarQube: "sonarcloud-parcelquote"
              organization: "louislawson"
              scannerMode: "cli"
              configMode: "manual"
              cliProjectKey: "louislawson_parcelquote-platform"
              cliSources: "src"
              extraProperties: |
                sonar.projectBaseDir=app
                sonar.tests=tests
                sonar.python.version=3.12
                sonar.python.coverage.reportPaths=$(Build.ArtifactStagingDirectory)/coverage.xml
                sonar.qualitygate.wait=true
          - script: |
              set -euo pipefail
              docker buildx build --target test -t parcelquote-test:$(Build.BuildId) app
            displayName: "Lint and build the test image"

          - script: |
              set -euo pipefail
              docker run --name pq-test parcelquote-test:$(Build.BuildId) || TEST_EXIT=$?
              docker cp pq-test:/app/reports/. "$(Build.ArtifactStagingDirectory)"
              docker rm pq-test
              exit ${TEST_EXIT:-0}
            displayName: "Run tests"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            displayName: "Publish test results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/junit.xml"
              failTaskOnFailedTests: false

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            displayName: "Publish coverage"
            inputs:
              summaryFileLocation: "$(Build.ArtifactStagingDirectory)/coverage.xml"

          - script: |
              set -euo pipefail
              docker buildx build --target runtime -t parcelquote-runtime:$(Build.BuildId) app
            displayName: "Build runtime target"

          - task: SonarCloudAnalyze@4
            displayName: "Run Sonar analysis"

          - task: SonarCloudPublish@4
            displayName: "Publish quality gate result"
            inputs:
              pollingTimeoutSec: "300"

          # Both Snyk tasks pin distributionChannel, and the reason is supply chain rather than
          # reproducibility. Unpinned, this task downloads snyk-linux from the stable channel
          # and executes it, with no checksum and no signature — in a pipeline that verifies
          # Terraform against a SHA256 and a GPG fingerprint, and tflint against a SHA256.
          #
          # Pinning does NOT make findings reproducible, and assuming it does would be a false
          # sense of control. Checkov's checks ship inside the package, so pinning 3.3.19 pins
          # the policy set; Snyk's verdicts come from its backend advisory database, which
          # changes continuously whatever the client version. Two runs of this pinned CLI a week
          # apart can legitimately disagree.
          #
          # It is also only half the job. The task downloads snyk-to-html from /latest/ as well
          # and exposes no input for it, so one of the two binaries stays unpinned no matter
          # what is configured here. Closing that would mean dropping the marketplace task and
          # handling the API token in a script, which is worse than the gap.
          #
          # A malformed value does not fail — it silently falls back to "stable". The task runs
          # the input through semver.clean and on failure logs "Invalid version format" and
          # carries on, so a typo here leaves the pipeline unpinned while looking pinned. The
          # only proof is the build log: it must show the version echoed back and the download
          # URL containing it. Either "v1.1307.4" or "1.1307.4" is accepted and both resolve to
          # the same URL; the v form is written here so the string appears in that URL verbatim
          # and the check is a literal match rather than a transformation.
          #
          # retryCountOnTaskFailure does not loosen the gate. A 504 from Snyk's backend is not a
          # finding, and reporting one as a security verdict is inaccurate rather than lenient —
          # builds 48 and 49 both failed that way during a vendor incident. It costs about forty
          # seconds per retry when a vulnerability is genuine, because the retry cannot tell the
          # two apart either. Two retries will not survive a sustained outage, only a blip.
          #
          # failOnIssues stays true, including for tool errors. A gate that passes when it could
          # not evaluate manufactures confidence, which is the same mistake as an alert firing
          # into a void. When Snyk is unreachable and something must ship, see the break-glass
          # note in README.md rather than flipping this.
          - task: SnykSecurityScan@1
            displayName: "Snyk — dependencies"
            retryCountOnTaskFailure: 2
            inputs:
              serviceConnectionEndpoint: "snyk-parcelquote"
              organization: "louislawson"
              testType: "app"
              testDirectory: "app"
              targetFile: "poetry.lock"
              severityThreshold: "high"
              additionalArguments: "--fail-on=upgradable"
              distributionChannel: "v1.1307.4"
              monitorWhen: "never"
              failOnIssues: true

          # Same pinning and retry reasoning as above.
          - task: SnykSecurityScan@1
            displayName: "Snyk — container image"
            retryCountOnTaskFailure: 2
            inputs:
              serviceConnectionEndpoint: "snyk-parcelquote"
              organization: "louislawson"
              testType: "container"
              dockerImageName: "parcelquote-runtime:$(Build.BuildId)"
              dockerfilePath: "app/Dockerfile"
              severityThreshold: "high"
              additionalArguments: "--fail-on=upgradable"
              distributionChannel: "v1.1307.4"
              monitorWhen: "never"
              failOnIssues: true
      - job: TerraformChecks
        displayName: "Format, validate and lint Terraform"
        steps:
          - template: templates/install-terraform-tools.yml
          - script: |
              set -euo pipefail
              terraform fmt -check -diff -recursive infra
            displayName: "Check formatting across infra"

          # Discovered rather than listed. The previous version named two directories, and when
          # infra/envs/prod arrived it was validated by nothing — the build passed while
          # checking none of the configuration the change was about. Anything holding a
          # backend block or a provider block is a root configuration and belongs here; the
          # shared module is covered through the roots that call it.
          - script: |
              set -euo pipefail
              mapfile -t dirs < <(find infra -name providers.tf -printf '%h\n' | sort)
              if [ "${#dirs[@]}" -eq 0 ]; then
                echo "##vso[task.logissue type=error]no root configurations found under infra"
                exit 1
              fi
              printf 'validating %d configurations:\n' "${#dirs[@]}"
              printf '  %s\n' "${dirs[@]}"
              for dir in "${dirs[@]}"; do
                echo "--- $dir"
                terraform -chdir="$dir" init -backend=false -input=false
                terraform -chdir="$dir" validate
                tflint --chdir="$dir"
              done
            displayName: "Validate and lint each configuration"

          - script: |
              set -euo pipefail
              pipx install "checkov==3.3.19"
              checkov --version
            displayName: "Install Checkov 3.3.19"

          - script: |
              set -euo pipefail
              checkov -d infra --framework terraform --compact \
                -o cli -o junitxml --output-file-path console,checkov-junit.xml
            displayName: "Checkov policy checks"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            displayName: "Publish Checkov results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "checkov-junit.xml"
              testRunTitle: "Checkov"
  - stage: Publish
    displayName: "Publish image"
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Push
        displayName: "Container registry"
        steps:
          - task: AzureCLI@2
            displayName: "Build and push tagged image"
            inputs:
              azureSubscription: "azure-parcelquote-dev"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail
                az acr login --name "$REGISTRY_NAME"
                TAG="${BUILD_SOURCEVERSION:0:7}"
                docker buildx create --name ci --use --driver docker-container
                docker buildx build --builder ci --target runtime \
                  --build-arg "GIT_SHA=$TAG" \
                  -t "$LOGIN_SERVER/parcelquote:$TAG" \
                  --cache-from "type=registry,ref=$LOGIN_SERVER/parcelquote:buildcache" \
                  --cache-to "type=registry,ref=$LOGIN_SERVER/parcelquote:buildcache,mode=max" \
                  --push app
  - stage: DeployDev
    displayName: "Deploy to dev"
    dependsOn: Publish
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: runLatest
    jobs:
      - deployment: Dev
        displayName: "Container app"
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/install-terraform-tools.yml
                - template: templates/terraform-apply.yml
                  parameters:
                    environment: dev
                    serviceConnection: "azure-parcelquote-dev"
                    displayName: "Plan and apply the dev environment"
                - task: PublishPipelineArtifact@1
                  displayName: "Publish the dev plan for review"
                  condition: succeededOrFailed()
                  inputs:
                    targetPath: "$(Build.ArtifactStagingDirectory)"
                    artifact: "terraform-plan-dev"
                    publishLocation: "pipeline"
                - template: templates/deploy-assertions.yml
                  parameters:
                    environment: dev
                    serviceConnection: "azure-parcelquote-dev"

  # Prod depends on DeployDev rather than on Publish, so dev is prod's canary: the same commit
  # and the same image have already applied cleanly and passed a smoke test before anyone is
  # asked to approve. The approval itself is not in this file — it is a check on the Azure
  # DevOps prod environment, which means a pull request cannot remove it. Every other gate in
  # this pipeline lives in a file a pull request can edit; this is the only one that does not.
  #
  # The stage itself is still not shared with DeployDev through a template, and the prediction
  # that made that choice has now come true: prod runs multi-revision mode, applies twice, and
  # verifies a revision between the two, none of which dev does. What they share is every part
  # that did not diverge — the three assertions in templates/deploy-assertions.yml, and one
  # plan-and-apply of one environment at one traffic split in templates/terraform-apply.yml,
  # which dev calls once and this stage calls twice.
  - stage: DeployProd
    displayName: "Deploy to prod"
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: runLatest
    jobs:
      - deployment: Prod
        displayName: "Container app"
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/install-terraform-tools.yml
                # Where the blue/green sequence gets its one input that is not in the repository:
                # which revision production is actually serving. Read from the live app rather
                # than derived from git, because the previous commit is not the previous
                # deployment if a run was ever skipped or failed, and rather than from a
                # Terraform output, because latest_revision_name is one revision stale
                # immediately after an apply. This read happens before anything is written, so
                # there is nothing for that race to touch.
                - task: AzureCLI@2
                  displayName: "Discover the revision prod is serving"
                  inputs:
                    azureSubscription: "azure-parcelquote-prod"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      # Literal names, as in templates/deploy-assertions.yml and for the same reason: this reads
                      # Azure rather than state, so it cannot interpolate the variables Terraform builds names from.
                      RG="rg-parcelquote-prod-uks-01"
                      APP="ca-parcelquote-prod-uks-01"
                      API="2026-07-01"

                      TAG="${BUILD_SOURCEVERSION:0:7}"
                      printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{7}$' || {
                        echo "##vso[task.logissue type=error]expected a seven-character short SHA, got '$TAG'"
                        exit 1
                      }
                      CANDIDATE="v$TAG"

                      SUB="$(az account show --query id -o tsv)"
                      URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.App/containerApps/$APP?api-version=$API"

                      # az rest and a pinned api-version rather than az containerapp, which is an extension this
                      # pipeline has never used. An absent extension makes the CLI try to prompt, and a prompt in a
                      # non-interactive script dies with EOF and a traceback that buries the cause. Pinning the API
                      # version also matches how every other version in this pipeline is handled.
                      #
                      # tr -d '\r' because the CLI terminates tsv rows with CRLF on some platforms, and a weight of
                      # "100\r" is numerically fine and textually not, which is the worst kind of difference.
                      ROWS="$(az rest --method get --url "$URL" \
                        --query "properties.configuration.ingress.traffic[].[revisionName, weight]" -o tsv | tr -d '\r')"

                      echo "live traffic weights:"
                      printf '%s\n' "$ROWS" | sed 's/^/  /'

                      STABLE=""
                      STABLE_WEIGHT=-1
                      CANDIDATE_WEIGHT=""
                      COUNT=0
                      TOTAL=0
                      while IFS=$'\t' read -r name weight; do
                        [ -n "$weight" ] || continue
                        COUNT=$((COUNT + 1))
                        TOTAL=$((TOTAL + weight))

                        # A weight carrying latestRevision names no revision, and --query renders that JSON null as
                        # the literal None rather than an empty field. It cannot be mistaken for a real suffix, since
                        # Azure requires those to be lower case, but it does have to be recognised.
                        [ "$name" = "None" ] && continue

                        suffix="${name#"$APP"--}"
                        if [ "$suffix" = "$CANDIDATE" ]; then
                          CANDIDATE_WEIGHT="$weight"
                        # The revision carrying the most traffic, not merely one that is not the candidate. After a
                        # rollback the array holds two of those - the revision that failed, left at 0, and the one
                        # traffic was returned to - and taking whichever appeared last made the answer depend on
                        # array order. Reversing two rows was enough to name the failed revision as the one to hold
                        # production traffic through the next deployment. Weight is the question being asked, so ask
                        # it directly; this is also correct in every shape that existed before rollbacks did.
                        elif [ "$weight" -gt "$STABLE_WEIGHT" ]; then
                          STABLE="$suffix"
                          STABLE_WEIGHT="$weight"
                        fi
                      done <<<"$ROWS"

                      # Two is the most this derivation can read: a candidate, and one revision holding the
                      # remainder. A third means something wrote weights that this stage did not - a hand edit, or a
                      # canary caught mid-rollout once that exists - and guessing which of three is the stable one is
                      # how traffic ends up on the wrong revision.
                      if [ "$COUNT" -gt 2 ]; then
                        echo "##vso[task.logissue type=error]$COUNT traffic weights, expected at most 2"
                        exit 1
                      fi
                      if [ "$TOTAL" -ne 100 ]; then
                        echo "##vso[task.logissue type=error]live weights total $TOTAL, not 100"
                        exit 1
                      fi

                      # Nothing named a revision, so the only weight is on latestRevision - the shape this app was
                      # left in before blue/green existed. Resolve it to the revision it actually points at rather
                      # than special-casing the first run.
                      if [ -z "$STABLE" ]; then
                        LATEST="$(az rest --method get --url "$URL" \
                          --query properties.latestRevisionName -o tsv | tr -d '\r')"
                        LATEST="${LATEST#"$APP"--}"
                        if [ -n "$LATEST" ] && [ "$LATEST" != "$CANDIDATE" ]; then
                          STABLE="$LATEST"
                        fi
                      fi

                      # The guard that matters. Re-running a build whose deployment already finished finds the
                      # candidate holding 100 per cent, and reading the stable revision as "whatever holds the
                      # traffic" would make it the candidate as well: two weights naming one revision, and a first
                      # apply that sends nothing to the revision production is serving. Taking the stable revision as
                      # the entry that is not the candidate makes a re-run plan no changes instead, and keeps the
                      # revision a rollback would need.
                      STAGED=true
                      if [ "$CANDIDATE_WEIGHT" = "100" ]; then
                        STAGED=false
                        echo "$CANDIDATE already holds 100 per cent - this commit has been deployed before"
                      fi

                      # No stable revision means nothing can hold the remainder while the candidate is verified, so
                      # there is no 0 per cent step to take. The module puts that weight on latest_revision, which is
                      # where Azure's own readiness gate applies. Only reachable in an environment with no revisions.
                      if [ -z "$STABLE" ]; then
                        STAGED=false
                        echo "no stable revision to hold traffic - the candidate goes straight to 100 per cent"
                      fi

                      echo "candidate:      $CANDIDATE"
                      echo "stable:         ${STABLE:-<none>}"
                      echo "staged rollout: $STAGED"

                      echo "##vso[task.setvariable variable=STABLE_SUFFIX]$STABLE"
                      echo "##vso[task.setvariable variable=STAGED_ROLLOUT]$STAGED"
                - template: templates/terraform-apply.yml
                  parameters:
                    environment: prod
                    serviceConnection: "azure-parcelquote-prod"
                    displayName: "Apply prod with the candidate at 0% traffic"
                    planFile: plan-staged.txt
                    candidatePercentage: "0"
                    condition: and(succeeded(), eq(variables['STAGED_ROLLOUT'], 'true'))
                # Acceptance check 3's evidence, and the only step in this stage that can tell a
                # working revision from a broken one before any traffic reaches it. Both halves
                # are asserted here rather than in two steps so the proof is a single log entry:
                # the candidate is serving the commit this build produced, and production is
                # still serving the one before it.
                - script: |
                    set -euo pipefail

                    # Both hostnames are set by the staged apply with task.setvariable, which Azure DevOps also
                    # exports to later steps as environment variables - the same contract templates/deploy-
                    # assertions.yml already relies on for APP_FQDN. Fail loudly on an empty one rather than
                    # testing nothing, which is what a curl against https:// would quietly do.
                    if [ -z "${CANDIDATE_FQDN:-}" ] || [ -z "${APP_FQDN:-}" ]; then
                      echo "##vso[task.logissue type=error]CANDIDATE_FQDN or APP_FQDN is empty - the staged apply did not set it"
                      exit 1
                    fi

                    TAG="${BUILD_SOURCEVERSION:0:7}"
                    RETRY=(--retry 10 --retry-all-errors --retry-delay 5 --max-time 20)

                    # The candidate has never served a request, so this pays the full cold start: 48 seconds,
                    # measured twice. The retry budget deliberately outlives its own --max-time, so the first two
                    # attempts time out and the third lands warm. Both numbers look generous in isolation and
                    # neither is spare.
                    echo "candidate: https://$CANDIDATE_FQDN"
                    echo "healthz: $(curl -fsS "${RETRY[@]}" "https://$CANDIDATE_FQDN/healthz")"

                    sha=""
                    for attempt in $(seq 1 12); do
                      sha="$(curl -fsS --max-time 15 "https://$CANDIDATE_FQDN/version" | jq -r '.git_sha' || true)"
                      [ "$sha" = "$TAG" ] && break
                      echo "attempt $attempt: git_sha=${sha:-<no response>}"
                      sleep 5
                    done

                    if [ "$sha" != "$TAG" ]; then
                      echo "##vso[task.logissue type=error]the candidate returned git_sha=$sha, expected $TAG"
                      exit 1
                    fi
                    echo "the candidate is serving $TAG while holding no traffic"

                    # The half that makes the half above mean something. If production were already on the new
                    # revision, the check above would have passed against the very revision it exists to protect,
                    # and the run would look like a successful blue/green while having isolated nothing.
                    live="$(curl -fsS "${RETRY[@]}" "https://$APP_FQDN/version" | jq -r '.git_sha')"
                    if [ "$live" = "$TAG" ]; then
                      echo "##vso[task.logissue type=error]production is already serving $TAG - the candidate was not isolated"
                      exit 1
                    fi

                    # A stable suffix is v followed by the commit it was built from, so the value production ought
                    # to be returning is derivable rather than merely different. Assert it only when the suffix has
                    # that shape: a revision Azure named itself carries no commit, and failing on a derivation that
                    # was never going to work would say nothing about this deployment.
                    if printf '%s' "${STABLE_SUFFIX:-}" | grep -Eq '^v[0-9a-f]{7}$'; then
                      expected="${STABLE_SUFFIX#v}"
                      if [ "$live" != "$expected" ]; then
                        echo "##vso[task.logissue type=error]production returned git_sha=$live, expected $expected from $STABLE_SUFFIX"
                        exit 1
                      fi
                      echo "production is still serving $expected on $STABLE_SUFFIX"
                    else
                      echo "production is serving $live, which is not $TAG; stable suffix ${STABLE_SUFFIX:-<none>} carries no commit to check against"
                    fi

                    # Last, so the log records a correct verification and then a failure that was
                    # asked for. The candidate holds no traffic at this point, so a run with this
                    # set proves the other half of the claim: a revision failing here never
                    # reaches production at all. The rollback still runs and plans nothing.
                    if [ "${{ parameters.failCanaryAt }}" = "0" ]; then
                      echo "##vso[task.logissue type=error]failing at 0% because failCanaryAt asked for it, to exercise the rollback"
                      exit 1
                    fi
                  displayName: "Verify the candidate while prod still serves the old revision"
                  condition: and(succeeded(), eq(variables['STAGED_ROLLOUT'], 'true'))
                # Two intermediate weights before the candidate takes everything. Neither buys a soak
                # - this service sees a couple of requests an hour, so there is no organic traffic to
                # watch and the alerts that might gate one run on fifteen-minute windows. What they do
                # buy is proof that weighting works at all, measured rather than read back, and two
                # earlier points at which a revision that is broken under real traffic takes the
                # rollback below instead of production.
                - template: templates/terraform-apply.yml
                  parameters:
                    environment: prod
                    serviceConnection: "azure-parcelquote-prod"
                    displayName: "Shift 10% of traffic to the new revision"
                    planFile: plan-canary-10.txt
                    candidatePercentage: "10"
                    condition: and(succeeded(), eq(variables['STAGED_ROLLOUT'], 'true'))
                - template: templates/verify-traffic-split.yml
                  parameters:
                    displayName: "Measure the split at 10%"
                    expectedCandidatePercentage: "10"
                    failAt: ${{ parameters.failCanaryAt }}
                    condition: and(succeeded(), eq(variables['STAGED_ROLLOUT'], 'true'))
                - template: templates/terraform-apply.yml
                  parameters:
                    environment: prod
                    serviceConnection: "azure-parcelquote-prod"
                    displayName: "Shift 50% of traffic to the new revision"
                    planFile: plan-canary-50.txt
                    candidatePercentage: "50"
                    condition: and(succeeded(), eq(variables['STAGED_ROLLOUT'], 'true'))
                # Fifty requests rather than a hundred. The hundred at ten per cent buys the one
                # assertion here that could be flaky; at an even split, two dozen would do and fifty
                # is already generous. Every request is a real span in Application Insights, so the
                # number is not free.
                - template: templates/verify-traffic-split.yml
                  parameters:
                    displayName: "Measure the split at 50%"
                    expectedCandidatePercentage: "50"
                    requests: "50"
                    failAt: ${{ parameters.failCanaryAt }}
                    condition: and(succeeded(), eq(variables['STAGED_ROLLOUT'], 'true'))
                # Weights live in configuration rather than template, which Azure classifies as an
                # application-scope change, so this apply creates no revision and costs only its own
                # init and plan. It runs unconditionally: where the staged apply was skipped this is
                # the only apply, and the candidate goes straight to 100 per cent.
                - template: templates/terraform-apply.yml
                  parameters:
                    environment: prod
                    serviceConnection: "azure-parcelquote-prod"
                    displayName: "Shift all traffic to the new revision"
                    planFile: plan-flip.txt
                    candidatePercentage: "100"
                # Runs whether or not the rollout was staged, because it is the only step that proves
                # traffic actually moved. It is stronger than the smoke test that follows it: that
                # one polls until a single request reports the new commit, this one requires every
                # request to, so a residual weight left on the outgoing revision fails here and
                # passes there.
                - template: templates/verify-traffic-split.yml
                  parameters:
                    displayName: "Measure the split after the shift"
                    expectedCandidatePercentage: "100"
                    requests: "50"
                    failAt: ${{ parameters.failCanaryAt }}
                # The rollback, and its position in the list is the design. It follows every check
                # that can indict the revision - the verification at zero traffic, both canary
                # measurements, and the one above - and precedes the two standing assertions about
                # the Key Vault grant and the alert receiver, which say nothing about this revision.
                # A vault grant that has drifted is not fixed by moving traffic, and a rollback
                # triggered by one would be a false remedy dressed up as a safe one.
                #
                # Gated on the rollout having been staged because that is what guarantees there is a
                # revision to go back to. Where it was not staged the single apply either changed
                # nothing or there is no stable revision at all, and candidate_percentage of 0 with
                # no stable suffix is a configuration the module refuses by design.
                #
                # The job stays failed afterwards. This returns production to service; it does not
                # make the deployment a success, and a green build here would be a lie.
                #
                # Not the runOnce strategy's own on.failure hook, which is where a reader familiar
                # with Azure Pipelines would look for this, and not its routeTraffic and
                # postRouteTraffic phases either. The hook runs on failure of *any* step in the
                # job, which would put the two standing assertions back inside the trigger and
                # undo the ordering above - a drifted Key Vault grant would move production
                # traffic. The lifecycle phases would express the shape more idiomatically and
                # would scope the hook correctly, but only by splitting this job into three, which
                # is a larger change than the thing it would tidy. Worth revisiting if a fourth
                # phase ever appears here.
                #
                # It also stands down when the step that failed reported that the previous
                # revision is the broken one, because returning all of production to a revision
                # that will not answer is worse than leaving it where it is.
                - template: templates/terraform-apply.yml
                  parameters:
                    environment: prod
                    serviceConnection: "azure-parcelquote-prod"
                    displayName: "Roll back: return all traffic to the previous revision"
                    planFile: plan-rollback.txt
                    candidatePercentage: "0"
                    condition: and(failed(), eq(variables['STAGED_ROLLOUT'], 'true'), ne(variables['ROLLBACK_UNSAFE'], 'true'))
                - task: PublishPipelineArtifact@1
                  displayName: "Publish the prod plan for review"
                  condition: succeededOrFailed()
                  inputs:
                    targetPath: "$(Build.ArtifactStagingDirectory)"
                    artifact: "terraform-plan-prod"
                    publishLocation: "pipeline"
                - template: templates/deploy-assertions.yml
                  parameters:
                    environment: prod
                    serviceConnection: "azure-parcelquote-prod"
