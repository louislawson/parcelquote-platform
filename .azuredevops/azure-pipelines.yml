variables:
  REGISTRY_NAME: "crparcelquoteuks01"
  LOGIN_SERVER: "crparcelquoteuks01.azurecr.io"

trigger:
  branches:
    include: [main]
  paths:
    include: [app, infra, .azuredevops]
    exclude: [infra/bootstrap]

pr:
  branches:
    include: [main]
  paths:
    include: [app, infra, .azuredevops]

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: LintTestBuild
        displayName: "Lint, test and build"
        steps:
          - checkout: self
            fetchDepth: 0
          - task: SonarCloudPrepare@4
            displayName: "Prepare Sonar analysis"
            inputs:
              SonarQube: "sonarcloud-parcelquote"
              organization: "louislawson"
              scannerMode: "cli"
              configMode: "manual"
              cliProjectKey: "louislawson_parcelquote-platform"
              cliSources: "src"
              extraProperties: |
                sonar.projectBaseDir=app
                sonar.tests=tests
                sonar.python.version=3.12
                sonar.python.coverage.reportPaths=$(Build.ArtifactStagingDirectory)/coverage.xml
                sonar.qualitygate.wait=true
          - script: |
              set -euo pipefail
              docker buildx build --target test -t parcelquote-test:$(Build.BuildId) app
            displayName: "Lint and build the test image"

          - script: |
              set -euo pipefail
              docker run --name pq-test parcelquote-test:$(Build.BuildId) || TEST_EXIT=$?
              docker cp pq-test:/app/reports/. "$(Build.ArtifactStagingDirectory)"
              docker rm pq-test
              exit ${TEST_EXIT:-0}
            displayName: "Run tests"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            displayName: "Publish test results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(Build.ArtifactStagingDirectory)/junit.xml"
              failTaskOnFailedTests: false

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            displayName: "Publish coverage"
            inputs:
              summaryFileLocation: "$(Build.ArtifactStagingDirectory)/coverage.xml"

          - script: |
              set -euo pipefail
              docker buildx build --target runtime app
            displayName: "Build runtime target"

          - task: SonarCloudAnalyze@4
            displayName: "Run Sonar analysis"

          - task: SonarCloudPublish@4
            displayName: "Publish quality gate result"
            inputs:
              pollingTimeoutSec: "300"
      - job: TerraformChecks
        displayName: "Format, validate and lint Terraform"
        steps:
          - template: templates/install-terraform-tools.yml
          - script: |
              set -euo pipefail
              terraform fmt -check -diff -recursive infra
            displayName: "Check formatting across infra"

          - script: |
              set -euo pipefail
              for dir in infra/bootstrap infra/envs/dev; do
                echo "--- $dir"
                terraform -chdir="$dir" init -backend=false -input=false
                terraform -chdir="$dir" validate
                tflint --chdir="$dir"
              done
            displayName: "Validate and lint each module"

          - script: |
              set -euo pipefail
              pipx install "checkov==3.3.19"
              checkov --version
            displayName: "Install Checkov 3.3.19"

          - script: |
              set -euo pipefail
              checkov -d infra --framework terraform --compact \
                -o cli -o junitxml --output-file-path console,checkov-junit.xml
            displayName: "Checkov policy checks"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            displayName: "Publish Checkov results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "checkov-junit.xml"
              testRunTitle: "Checkov"
  - stage: Publish
    displayName: "Publish image"
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Push
        displayName: "Container registry"
        steps:
          - task: AzureCLI@2
            displayName: "Build and push tagged image"
            inputs:
              azureSubscription: "azure-parcelquote-dev"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail
                az acr login --name "$REGISTRY_NAME"
                TAG="${BUILD_SOURCEVERSION:0:7}"
                docker buildx create --name ci --use --driver docker-container
                docker buildx build --builder ci --target runtime \
                  --build-arg "GIT_SHA=$TAG" \
                  -t "$LOGIN_SERVER/parcelquote:$TAG" \
                  --cache-from "type=registry,ref=$LOGIN_SERVER/parcelquote:buildcache" \
                  --cache-to "type=registry,ref=$LOGIN_SERVER/parcelquote:buildcache,mode=max" \
                  --push app
  - stage: DeployDev
    displayName: "Deploy to dev"
    dependsOn: Publish
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: runLatest
    jobs:
      - deployment: Dev
        displayName: "Container app"
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/install-terraform-tools.yml
                - task: AzureCLI@2
                  displayName: "Plan and apply the dev environment"
                  env:
                    ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
                    TF_VAR_owner: $(OWNER)
                  inputs:
                    azureSubscription: "azure-parcelquote-dev"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID="$AZURESUBSCRIPTION_CLIENT_ID"
                      export ARM_TENANT_ID="$AZURESUBSCRIPTION_TENANT_ID"
                      export ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      export ARM_USE_OIDC=true
                      export ARM_USE_CLI=false
                      TAG="${BUILD_SOURCEVERSION:0:7}"
                      terraform -chdir=infra/envs/dev init -input=false
                      terraform -chdir=infra/envs/dev plan -input=false -lock-timeout=5m \
                        -var-file=dev.tfvars -var "image_tag=$TAG" -out=tfplan
                      terraform -chdir=infra/envs/dev show -no-color tfplan > "$BUILD_ARTIFACTSTAGINGDIRECTORY/plan.txt"
                      terraform -chdir=infra/envs/dev apply -input=false -lock-timeout=5m tfplan
                      FQDN="$(terraform -chdir=infra/envs/dev output -raw app_fqdn)"
                      echo "##vso[task.setvariable variable=APP_FQDN]$FQDN"
                - task: PublishPipelineArtifact@1
                  displayName: "Publish the plan for review"
                  condition: succeededOrFailed()
                  inputs:
                    targetPath: "$(Build.ArtifactStagingDirectory)"
                    artifact: "terraform-plan"
                    publishLocation: "pipeline"
                - script: |
                    set -euo pipefail
                    if [ -z "${APP_FQDN:-}" ]; then
                      echo "##vso[task.logissue type=error]APP_FQDN is empty - the apply step did not set it"
                      exit 1
                    fi

                    TAG="${BUILD_SOURCEVERSION:0:7}"
                    BASE="https://${APP_FQDN}"
                    RETRY=(--retry 10 --retry-all-errors --retry-delay 5 --max-time 20)

                    echo "Smoke testing $BASE, expecting $TAG"

                    echo "healthz: $(curl -fsS "${RETRY[@]}" "$BASE/healthz")"

                    # Traffic reaches the new revision a moment after apply returns, so
                    # poll rather than asserting once.
                    sha=""
                    for attempt in $(seq 1 12); do
                      sha="$(curl -fsS --max-time 15 "$BASE/version" | jq -r '.git_sha' || true)"
                      [ "$sha" = "$TAG" ] && break
                      echo "attempt $attempt: git_sha=${sha:-<no response>}"
                      sleep 5
                    done

                    if [ "$sha" != "$TAG" ]; then
                      echo "##vso[task.logissue type=error]/version returned git_sha=$sha, expected $TAG"
                      exit 1
                    fi

                    echo "$APP_FQDN is serving $TAG"
                  displayName: "Smoke test the new revision"
