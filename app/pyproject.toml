[project]
name = "parcelquote"
version = "0.1.0"
description = "Shipping quote API that prices parcels on chargeable weight and destination zone"
authors = [{ name = "Louis Lawson", email = "louis.lawson@louislawson.co.uk" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    # The floor is load-bearing rather than hygiene. Below 1.8.10 the distro pins an exporter
    # predating the fix for azure-sdk-for-python#46103, which logs an Unauthorized error every
    # fifteen minutes when the component has local authentication disabled — which ours does.
    "azure-monitor-opentelemetry (>=1.8.10,<2.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.6,<0.17.0)",
]

[tool.coverage.run]
relative_files = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "parcelquote", from = "src" }]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
